[package]
name = "encryption-demo"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
risc0-zkvm  = { version = "2.3.1", features = ["std", "prove"] }
anyhow     = "1.0"
hex         = "0.4"

[dev-dependencies]
chacha20 = "0.9"
cipher = { version = "0.4", features = ["std"] }

[build-dependencies]
risc0-build = "2.3.1"

[package.metadata.risc0]
methods = ["methods/guest"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(rust_analyzer)'] }

