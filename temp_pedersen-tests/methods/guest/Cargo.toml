[package]
name = "nebra0_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.dev]
opt-level = 3
[profile.test]
opt-level = 3
[profile.release]
opt-level = 3
[profile.bench]
opt-level = 3


[dependencies]
# If you want to try (experimental) std support, add `features = [ "std" ]` to risc0-zkvm
risc0-zkvm = "2.0.0"
pasta_curves= "0.5.1"

[patch.crates-io.crypto-bigint]
git = "https://github.com/risc0/RustCrypto-crypto-bigint"
tag = "v0.5.5-risczero.0"
